---
layout: default
---

<!-- MathJax Configuration -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    processEnvironments: true,
    tags: 'ams',
    macros: {
      RR: '{\\bf R}',
      bold: ['{\\bf #1}', 1]
    }
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  startup: {
    ready: () => {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => {
        console.log('MathJax initial typesetting complete');
      });
    }
  }
};
</script>
<script async src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
.code-block-wrapper {
    position: relative;
    margin: 1em 0;
}

.code-block-wrapper pre {
    margin: 0;
    padding: 1em;
    background-color: #f0f0f0;
    border: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    overflow-x: auto;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace;
    font-size: 0.9em;
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: rgba(0, 0, 0, 0.2) #f0f0f0;
}

.code-block-wrapper code {
    background: transparent;
    padding: 0;
    border: none;
    font-family: inherit;
}

/* Custom scrollbar to match page style */
.code-block-wrapper pre::-webkit-scrollbar {
    height: 8px;
}

.code-block-wrapper pre::-webkit-scrollbar-track {
    background: #f0f0f0;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
}

.code-block-wrapper pre::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
}

.code-block-wrapper pre::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.3);
}

.copy-button {
    position: absolute;
    top: 8px;
    right: 8px;
    background-color: transparent;
    color: #FF0F00;
    border: 1px solid #FF0F00;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.85em;
    font-family: "Space Grotesk", sans-serif;
    transition: background-color 0.2s, color 0.2s;
    z-index: 10;
}

.copy-button:hover {
    background-color: #FF0F00;
    color: white;
    text-decoration: none;
}

.copy-button:active {
    background-color: #cc0c00;
    border-color: #cc0c00;
}

.copy-button.copied {
    background-color: #FF0F00;
    color: white;
    border-color: #FF0F00;
}

</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const codeBlocks = document.querySelectorAll('.code-block-wrapper');
    
    codeBlocks.forEach(function(wrapper) {
        const button = wrapper.querySelector('.copy-button');
        const codeBlock = wrapper.querySelector('code');
        
        if (button && codeBlock) {
            button.addEventListener('click', function() {
                const text = codeBlock.textContent || codeBlock.innerText;
                
                // Use the modern Clipboard API
                navigator.clipboard.writeText(text).then(function() {
                    // Visual feedback
                    const originalText = button.textContent;
                    button.classList.add('copied');
                    button.textContent = '✓ Copied!';
                    
                    setTimeout(function() {
                        button.classList.remove('copied');
                        button.textContent = originalText;
                    }, 2000);
                }).catch(function(err) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.opacity = '0';
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        const originalText = button.textContent;
                        button.classList.add('copied');
                        button.textContent = '✓ Copied!';
                        setTimeout(function() {
                            button.classList.remove('copied');
                            button.textContent = originalText;
                        }, 2000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                    }
                    document.body.removeChild(textArea);
                });
            });
        }
    });
});
</script>

<div class="blog-post">
    <h1 class="blog-title">{{ page.title }}</h1>
    
    <div class="blog-meta">
        <p class="blog-date">
            <i class="fa fa-calendar" aria-hidden="true"></i> 
            {{ page.date | date: site.minima.date_format }}
        </p>
        {% if page.author %}
        <p class="blog-author">
            <i class="fa fa-user" aria-hidden="true"></i> 
            {{ page.author }}
        </p>
        {% endif %}
        {% if page.tags %}
        <p class="blog-tags">
            <i class="fa fa-tags" aria-hidden="true"></i> 
            {% for tag in page.tags %}
                <span class="tag">{{ tag }}</span>{% unless forloop.last %}, {% endunless %}
            {% endfor %}
        </p>
        {% endif %}
    </div>
    
    <hr>
    
    <div class="blog-content">
        {{ content }}
    </div>
    
    <hr>
    
    <div class="blog-navigation">
        <a href="/blogs" class="back-to-blogs">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> Back to Blogs
        </a>
    </div>
</div>
